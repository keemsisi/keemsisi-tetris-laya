<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Tetris</title>
<style>
  :root {
    --bg: #0b0f1a;
    --panel: #141a2b;
    --panel-2: #1b2338;
    --grid: #1f2740;
    --grid-line: #263153;
    --text: #e6ecff;
    --muted: #8a96b8;
    --accent: #6ea8ff;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(1200px 700px at 50% -10%, #17203a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; align-items: center; padding: 18px 14px 28px; }

  h1 {
    margin: 0 0 14px;
    font-size: 26px; font-weight: 800; letter-spacing: 6px; text-transform: uppercase;
    background: linear-gradient(90deg,#22d3ee,#6ea8ff,#a855f7);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .game {
    display: flex; gap: 16px; align-items: flex-start;
    max-width: 100%;
  }

  .stage {
    position: relative;
    background: var(--grid);
    border: 1px solid var(--grid-line);
    border-radius: 12px;
    padding: 6px;
    box-shadow: var(--shadow);
  }
  #board { display: block; border-radius: 8px; background: #121a2e; max-width: 100%; height: auto; touch-action: none; }

  .overlay {
    position: absolute; inset: 6px;
    display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(9,13,24,.86);
    backdrop-filter: blur(3px);
    border-radius: 8px;
    text-align: center; padding: 16px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }
  .overlay p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .overlay .final { font-size: 15px; color: var(--text); }

  button {
    font: inherit; font-weight: 700;
    color: #0b0f1a; background: linear-gradient(180deg,#8fc0ff,#5b95f0);
    border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(91,149,240,.35);
  }
  button:active { transform: translateY(1px); }
  button.ghost {
    color: var(--text); background: var(--panel-2);
    border: 1px solid var(--grid-line); box-shadow: none;
  }

  aside { width: 172px; display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--grid-line);
    border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow);
  }
  .card h3 {
    margin: 0 0 8px; font-size: 10px; letter-spacing: 1.6px;
    text-transform: uppercase; color: var(--muted); font-weight: 700;
  }
  .stat { display: flex; justify-content: space-between; align-items: baseline; margin: 5px 0; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat b { font-size: 17px; font-variant-numeric: tabular-nums; }
  .mini { display: block; margin: 0 auto; }
  #next { background: var(--panel-2); border-radius: 8px; }
  #hold { background: var(--panel-2); border-radius: 8px; }

  .keys { font-size: 11px; color: var(--muted); line-height: 1.85; }
  .keys div { display: flex; justify-content: space-between; gap: 8px; }
  kbd {
    background: var(--panel-2); border: 1px solid var(--grid-line);
    border-bottom-width: 2px; border-radius: 5px;
    padding: 1px 6px; font: 600 10px/1.6 ui-monospace, monospace; color: var(--text);
  }

  .toast {
    position: absolute; left: 50%; top: 18%; transform: translateX(-50%);
    font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
    color: #ffe8a3; text-shadow: 0 2px 10px rgba(0,0,0,.6);
    pointer-events: none; opacity: 0; font-size: 18px;
  }
  .toast.pop { animation: pop 900ms ease-out forwards; }
  @keyframes pop {
    0%   { opacity: 0; transform: translateX(-50%) scale(.7); }
    18%  { opacity: 1; transform: translateX(-50%) scale(1.08); }
    70%  { opacity: 1; transform: translateX(-50%) translateY(-6px) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-18px) scale(1); }
  }

  .touch { display: none; margin-top: 14px; gap: 8px; width: 100%; max-width: 360px; }
  .touch button { flex: 1; padding: 14px 0; font-size: 13px; }


  /* ----------------------- decision engine panel ------------------ */
  .engine { width: 268px; flex: 0 0 268px; }
  .engine .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .engine .head h3 { margin: 0; }
  .badge {
    font: 800 9px/1 ui-monospace, monospace; letter-spacing: 1.2px;
    padding: 4px 7px; border-radius: 999px; text-transform: uppercase;
    border: 1px solid transparent; white-space: nowrap;
  }
  .badge.laya     { color: #0b0f1a; background: #6ee7a8; }
  .badge.fallback { color: #0b0f1a; background: #fbbf50; }
  .badge.offline  { color: #ffb4b4; background: rgba(239,68,68,.16); border-color: rgba(239,68,68,.45); }
  .badge.loading  { color: #cfe0ff; background: rgba(110,168,255,.16); border-color: rgba(110,168,255,.45); }

  .seg { display: flex; gap: 4px; background: var(--panel-2); border: 1px solid var(--grid-line); border-radius: 9px; padding: 3px; }
  .seg button {
    flex: 1; padding: 7px 0; font-size: 11px; font-weight: 700; border-radius: 6px;
    background: transparent; color: var(--muted); box-shadow: none;
  }
  .seg button.on { background: linear-gradient(180deg,#8fc0ff,#5b95f0); color: #0b0f1a; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 9px 0 0; font-size: 11px; color: var(--muted); }
  .row .v { color: var(--text); font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; }
  select {
    font: inherit; font-size: 11px; font-weight: 600; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--grid-line);
    border-radius: 7px; padding: 5px 7px;
  }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); cursor: pointer; }

  .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg,#22d3ee,#6ea8ff); width: 0; transition: width .18s ease; }

  .field { margin-top: 12px; }
  .field .k { font-size: 9px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .field .big { font-size: 14px; font-weight: 800; margin: 3px 0 5px; }
  .field .note { font-size: 10.5px; color: var(--muted); line-height: 1.5; }

  .risk { display: flex; gap: 3px; margin: 5px 0; }
  .risk i { flex: 1; height: 6px; border-radius: 2px; background: rgba(255,255,255,.08); }
  .risk i.on0 { background: #22c55e; }
  .risk i.on1 { background: #a3e635; }
  .risk i.on2 { background: #f59e0b; }
  .risk i.on3 { background: #ef4444; }

  .cands { margin-top: 6px; display: flex; flex-direction: column; gap: 5px; }
  .cand { display: grid; grid-template-columns: 14px 1fr 30px; gap: 7px; align-items: center; font-size: 10px; }
  .cand .key { font: 800 10px/1 ui-monospace, monospace; color: var(--muted); text-align: center; }
  .cand.pick .key { color: #6ee7a8; }
  .cand .p { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cand .bar i { background: rgba(255,255,255,.28); }
  .cand.pick .bar i { background: linear-gradient(90deg,#34d399,#6ee7a8); }
  .cand .txt { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .tally { margin-top: 12px; font: 600 10px/1.7 ui-monospace, monospace; color: var(--muted); }
  .tally span { color: var(--text); }
  .why { margin-top: 8px; font-size: 10px; color: var(--muted); line-height: 1.5; }
  .reason { margin-top: 8px; font-size: 10px; color: #ffb4b4; line-height: 1.5; }

  @media (max-width: 980px) {
    .engine { width: 100%; flex: 1 1 100%; max-width: 360px; order: 3; }
  }
  @media (max-width: 620px) {
    .game { flex-direction: column; align-items: center; gap: 12px; }
    aside { width: 100%; max-width: 360px; flex-direction: row; flex-wrap: wrap; }
    aside .card { flex: 1 1 40%; }
    aside .card.keys-card { display: none; }
    .touch { display: flex; flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <h1>Tetris</h1>

  <div class="game">

      <section class="card engine">
        <div class="head">
          <h3>Decision engine</h3>
          <span class="badge offline" id="eBadge">offline</span>
        </div>

        <div class="seg" id="eMode">
          <button data-mode="off" class="on">Off</button>
          <button data-mode="assist">Assist</button>
          <button data-mode="autoplay">Autoplay</button>
        </div>

        <div class="row">
          <span>Speed</span>
          <select id="eSpeed">
            <option value="140">Watch</option>
            <option value="55" selected>Fast</option>
            <option value="0">Instant</option>
          </select>
        </div>
        <div class="row">
          <label class="chk"><input type="checkbox" id="eLoop" checked /> Restart on game over</label>
        </div>
        <div class="row">
          <label class="chk" title="Hold each piece until the model answers. Laya takes ~0.7s per move, so this is slower but every placement is the model's.">
            <input type="checkbox" id="eWait" /> Wait for every decision
          </label>
        </div>

        <div class="field">
          <div class="k">Strategy</div>
          <div class="big" id="eStrategy">&mdash;</div>
          <div class="bar"><i id="eStrategyBar"></i></div>
          <div class="note" id="eStrategyWhy"></div>
        </div>

        <div class="field">
          <div class="k">Top-out risk</div>
          <div class="risk" id="eRisk"><i></i><i></i><i></i><i></i></div>
          <div class="note" id="eRiskLabel">&mdash;</div>
        </div>

        <div class="field">
          <div class="k">Move</div>
          <div class="cands" id="eCands"></div>
          <div class="why" id="eWhy"></div>
        </div>

        <div class="tally" id="eTally"></div>
        <div class="reason" id="eReason" hidden></div>
      </section>

    <div class="stage">
      <canvas id="board" width="300" height="600"></canvas>
      <div class="toast" id="toast"></div>
      <div class="overlay show" id="overlay">
        <h2 id="ovTitle">Ready?</h2>
        <p id="ovText">Arrows to move &middot; Up to rotate &middot; Space to hard drop</p>
        <p class="final" id="ovFinal" hidden></p>
        <button id="ovBtn">Play</button>
      </div>
    </div>

    <aside>
      <div class="card">
        <h3>Score</h3>
        <div class="stat"><span>Points</span><b id="score">0</b></div>
        <div class="stat"><span>Lines</span><b id="lines">0</b></div>
        <div class="stat"><span>Level</span><b id="level">1</b></div>
        <div class="stat"><span>Best</span><b id="best">0</b></div>
      </div>
      <div class="card">
        <h3>Next</h3>
        <canvas id="next" class="mini" width="120" height="216"></canvas>
      </div>
      <div class="card">
        <h3>Hold</h3>
        <canvas id="hold" class="mini" width="120" height="72"></canvas>
      </div>
      <div class="card keys-card">
        <h3>Controls</h3>
        <div class="keys">
          <div><span>Move</span><span><kbd>&larr;</kbd><kbd>&rarr;</kbd></span></div>
          <div><span>Soft drop</span><span><kbd>&darr;</kbd></span></div>
          <div><span>Hard drop</span><span><kbd>Space</kbd></span></div>
          <div><span>Rotate</span><span><kbd>&uarr;</kbd><kbd>X</kbd></span></div>
          <div><span>Rotate CCW</span><span><kbd>Z</kbd></span></div>
          <div><span>Hold</span><span><kbd>C</kbd></span></div>
          <div><span>Pause</span><span><kbd>P</kbd></span></div>
          <div><span>Restart</span><span><kbd>R</kbd></span></div>
          <div><span>Engine mode</span><span><kbd>M</kbd></span></div>
        </div>
      </div>
    </aside>
  </div>

  <div class="touch" id="touch">
    <button class="ghost" data-act="left">&larr;</button>
    <button class="ghost" data-act="ccw">&#8630;</button>
    <button class="ghost" data-act="cw">&#8631;</button>
    <button class="ghost" data-act="right">&rarr;</button>
    <button class="ghost" data-act="soft">&darr;</button>
    <button class="ghost" data-act="hard">Drop</button>
    <button class="ghost" data-act="hold">Hold</button>
    <button class="ghost" data-act="pause">Pause</button>
  </div>


<script src="game.js"></script>
<script src="bot.js"></script>
<script src="laya-client.js"></script>
<script>
'use strict';

/* ------------------------------------------------------------------ *
 * Page glue: wires the game core, the placement bot and the Laya
 * sidecar together, and renders what the engine decided.
 * ------------------------------------------------------------------ */

(function () {
  const T = window.Tetris;
  const client = window.LayaClient.createClient();
  const bot = window.TetrisBotCore.createBot(T, { stepMs: 55 });
  bot.attach();

  // The bot asks the sidecar; a null answer means "decide it yourself".
  bot.decide = function (snap) {
    snap.cols = T.COLS;
    snap.rows = T.ROWS;
    return client.decide(snap);
  };

  const q = function (id) { return document.getElementById(id); };
  const ui = {
    badge: q('eBadge'), mode: q('eMode'), speed: q('eSpeed'), loop: q('eLoop'), wait: q('eWait'),
    strategy: q('eStrategy'), strategyBar: q('eStrategyBar'), strategyWhy: q('eStrategyWhy'),
    risk: q('eRisk'), riskLabel: q('eRiskLabel'),
    cands: q('eCands'), why: q('eWhy'), tally: q('eTally'), reason: q('eReason')
  };

  const STRATEGY_BLURB = {
    balanced: 'Standard efficient play, no agenda.',
    downstack: 'Digging out buried cells, height is acceptable.',
    build_tetris: 'Stacking nine wide, right column held open for a four-row clear.',
    flatten: 'Evening out a jagged surface.',
    survive: 'Stack is high - clearing rows at any cost.'
  };

  /* ------------------------------ render --------------------------- */

  function setBadge() {
    const e = bot.mode === 'off' ? 'off' : client.engine;
    const cls = e === 'laya' ? 'laya' : e === 'fallback' ? 'fallback' : 'offline';
    ui.badge.className = 'badge ' + (bot.mode === 'off' ? 'loading' : cls);
    ui.badge.textContent = bot.mode === 'off' ? 'idle'
      : e === 'laya' ? 'laya' : e === 'fallback' ? 'fallback' : 'offline';
    const showReason = bot.mode !== 'off' && client.engine !== 'laya' && client.reason;
    ui.reason.hidden = !showReason;
    if (showReason) ui.reason.textContent = client.reason;
  }

  function renderDecision(d, b) {
    setBadge();

    const strat = (d && d.strategy) || b.strategy;   // null on a move-only answer
    ui.strategy.textContent = strat.replace(/_/g, ' ');
    const sc = d && typeof d.strategyConfidence === 'number' ? d.strategyConfidence : 0;
    ui.strategyBar.style.width = Math.round(sc * 100) + '%';
    ui.strategyWhy.textContent = STRATEGY_BLURB[strat] || '';

    // Risk and strategy arrive on their own cadence; keep the last known
    // values rather than blanking them on a move-only answer.
    const risk = Math.round((d && typeof d.risk === 'number' ? d.risk : b.risk) || 0);
    Array.prototype.forEach.call(ui.risk.children, function (i, n) {
      i.className = n <= risk && d ? 'on' + risk : '';
    });
    ui.riskLabel.textContent = (d && d.riskLabel) || b.riskLabel || (d ? '' : 'no decision yet');

    // Candidate shortlist with Laya's probability distribution.
    const probs = (d && d.moveProbabilities) || null;
    ui.cands.innerHTML = '';
    b.candidates.forEach(function (c, i) {
      const key = window.TetrisBotCore.KEYS[i];
      const p = probs && typeof probs[key] === 'number' ? probs[key] : null;
      const picked = b.plan === c;
      const row = document.createElement('div');
      row.className = 'cand' + (picked ? ' pick' : '');
      row.innerHTML =
        '<div class="key">' + key + '</div>' +
        '<div><div class="txt"></div><div class="bar"><i style="width:' +
        (p === null ? (picked ? 100 : 0) : Math.round(p * 100)) + '%"></i></div></div>' +
        '<div class="p">' + (p === null ? (picked ? 'pick' : '') : p.toFixed(2)) + '</div>';
      row.querySelector('.txt').textContent = c.why;
      row.title = c.why;
      ui.cands.appendChild(row);
    });

    const parts = [];
    if (d) {
      if (d.engine === 'laya') parts.push('Laya answered in ' + d.ms + 'ms' +
        (d.promptTokens ? ' \u00B7 ' + d.promptTokens + ' tokens' : ''));
      else parts.push('deterministic fallback');
      if (d.useHoldProbability > 0) parts.push('hold swap p=' + d.useHoldProbability.toFixed(2));
      if (b.chose && d.moveConfidence < bot.opt.confidenceFloor) {
        parts.push('confidence ' + d.moveConfidence.toFixed(2) + ' below floor, kept the ranked pick');
      }
    } else if (bot.mode !== 'off') {
      parts.push('no engine - using the built-in ranking');
    }
    ui.why.textContent = parts.join(' · ');

    const s = b.stats;
    ui.tally.textContent =
      'pieces ' + s.pieces + '  laya ' + s.laya + '  fallback ' + s.fallback +
      '  offline ' + s.offline + '\noverrides ' + s.overrides + '  timeouts ' + s.timeouts + '  holds ' + s.holds;
  }

  bot.onDecision = renderDecision;

  /* ------------------------------ controls ------------------------- */

  function setMode(m) {
    Array.prototype.forEach.call(ui.mode.children, function (b) {
      b.classList.toggle('on', b.dataset.mode === m);
    });
    bot.setMode(m);
    setBadge();
    if (m !== 'off') {
      client.health().then(function () { setBadge(); renderDecision(bot.decision, bot); });
      if (!T.S.running && !T.S.over) T.start();
    }
    renderDecision(bot.decision, bot);
  }

  ui.mode.addEventListener('click', function (e) {
    const b = e.target.closest('button[data-mode]');
    if (b) setMode(b.dataset.mode);
  });
  ui.speed.addEventListener('change', function () {
    bot.opt.stepMs = Number(ui.speed.value);
  });
  // Laya needs ~0.7s per move; at instant speed a piece is placed long
  // before an answer arrives, so this trades wall-clock for the model
  // actually deciding every placement.
  ui.wait.addEventListener('change', function () {
    bot.opt.waitForDecision = ui.wait.checked;
  });
  window.addEventListener('keydown', function (e) {
    if (e.code !== 'KeyM') return;
    const order = ['off', 'assist', 'autoplay'];
    setMode(order[(order.indexOf(bot.mode) + 1) % order.length]);
  });

  // Autoplay keeps going so you can watch it play a long game.
  setInterval(function () {
    if (bot.mode === 'autoplay' && T.S.over && ui.loop.checked) T.start();
  }, 1500);

  // Keep the badge honest about the sidecar's state.
  client.health().then(setBadge);
  setInterval(function () { if (bot.mode !== 'off') client.health().then(setBadge); }, 5000);

  renderDecision(null, bot);
  window.__bot = bot;          // handy at the console
  window.__client = client;
})();
</script>
</body>
</html>
